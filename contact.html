<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
   
</head>
<body>
    <h1>Contact Us</h1>
    

     <form action="#" method="post">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br>
         <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br>
            
        <label for="message">Comment:</label><br>
        <textarea id="message" name="message" rows="4" required></textarea><br><br>

        <button type="submit">Clear</button>
        <button type="submit">Okay</button>
    </form>

     <nav style="position: sticky; bottom:0px ; overflow-x:auto">

        <div style="display: flex; flex-direction: row; justify-content: space-evenly; align-items: center; width: 100%; padding: 10px; box-sizing: border-box;">

            <button style="width:70px; height:30px ; border-radius:25px">Home</button>
            <button style="width:70px; height:30px; border-radius:25px">Navigate</button>

        </div>
        

    </nav>
</body>
</html>
